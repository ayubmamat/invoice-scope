services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoicescope
      POSTGRES_PASSWORD: invoicescope
      POSTGRES_DB: invoicescope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicescope -d invoicescope"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://invoicescope:invoicescope@postgres:5432/invoicescope
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - invoice_data:/data
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
  invoice_data:
